name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  # ---------------------------------------------------------------------------
  # 1. Lint + type check
  # ---------------------------------------------------------------------------
  lint:
    name: Lint & Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install lint tools
        run: pip install ruff==0.4.4

      - name: Run Ruff linter
        run: ruff check backend/ tests/

      - name: Run Ruff formatter check
        run: ruff format --check backend/ tests/

  # ---------------------------------------------------------------------------
  # 2. Unit + integration tests (no Docker, no OpenAI key needed)
  # ---------------------------------------------------------------------------
  test:
    name: Pytest (async, SQLite)
    runs-on: ubuntu-latest
    needs: lint

    env:
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      JWT_SECRET_KEY: ci-test-secret-key
      OPENAI_API_KEY: sk-fake-key-for-ci
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      - name: Run tests with coverage
        run: |
          pytest tests/ \
            --cov=backend \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # 3. Docker build smoke test (verifies image builds without errors)
  # ---------------------------------------------------------------------------
  docker-build:
    name: Docker Build (slim, no local embeddings)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            ENABLE_LOCAL_EMBEDDINGS=false
          tags: academic-assignment-helper:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
