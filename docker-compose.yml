services:
  db:
    image: pgvector/pgvector:pg16
    container_name: academic-assignment-helper-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENABLE_LOCAL_EMBEDDINGS: ${ENABLE_LOCAL_EMBEDDINGS:-false}
    container_name: academic-assignment-helper-backend
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      N8N_WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL}
      OPENAI_COMPLETION_MODEL: ${OPENAI_COMPLETION_MODEL}
      RAG_CHUNK_SIZE: ${RAG_CHUNK_SIZE}
      RAG_MAX_CHUNKS: ${RAG_MAX_CHUNKS}
      PLAGIARISM_THRESHOLD: ${PLAGIARISM_THRESHOLD}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      PYTHONPATH: /app
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data
      - uploads_data:/app/uploads
    ports:
      - "8000:8000"
    # 45s sleep gives PostgreSQL time to finish initdb on first boot
    command: >
      sh -c "echo 'Waiting 45s for DB...' && sleep 45 && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload"
    restart: on-failure

  n8n:
    image: n8nio/n8n
    container_name: n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_BASIC_AUTH_ACTIVE=false
      - NODE_ENV=production
    volumes:
      - n8n_data:/home/node/.n8n
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: academic-assignment-helper-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  db-data:
  n8n_data:
  uploads_data:
